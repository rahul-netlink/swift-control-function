[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["ControlFunction", "ClaimCache", "AttestationVerifier"]
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{access = "read-write", path = "../fixtures"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
